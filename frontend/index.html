<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema integral de Recursos Humanos, Control de Asistencia y Planilla">

  <title>RRHH · Control de Asistencia</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS único -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- ============================================================
       APP SHELL
       Sidebar + Header + Main content (SPA container)
       ============================================================ -->

  <div class="app-shell">

    <!-- Overlay para cerrar sidebar en mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar: generado dinámicamente por js/components/sidebar.js -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Área principal -->
    <div class="main-area">

      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="btn-menu-mobile" id="btn-menu-mobile" aria-label="Abrir menú">☰</button>
          <div class="breadcrumb" id="breadcrumb">
            <span>RRHH</span>
            <span class="separator">›</span>
            <span class="current" id="breadcrumb-current">Dashboard</span>
          </div>
        </div>
        <div class="header-right">
          <span class="header-clock" id="header-clock">--:--:--</span>
        </div>
      </header>

      <!-- Contenedor principal donde el Router inyecta las vistas -->
      <main class="main-content" id="app-content">
        <!-- Las vistas se cargan dinámicamente aquí -->
        <div class="loading-screen">
          <div class="spinner lg"></div>
          <span>Cargando...</span>
        </div>
      </main>

    </div>
  </div>

  <!-- Contenedor de notificaciones Toast -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ============================================================
       JAVASCRIPT — ES Modules
       ============================================================ -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
